<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Cozy Room</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="top">
      <h1 class="title">My Cozy Room</h1>
      <div class="account">
        <span id="account-name"></span>
        <span id="account-status"></span>
        <button id="login-btn" type="button">구글로 로그인</button>
      </div>
    </header>

    <div id="app-home">
      <!-- 게임 전체. '항상 위에 띄우기'를 누르면 이 부분이 작은 창으로 옮겨집니다. -->
      <div id="app">
        <div class="stage">
          <canvas id="game" width="480" height="384"></canvas>

          <!-- 코인과 시계 -->
          <div class="hud">
            <span class="pill"><i class="coin"></i><span id="coins">0</span><span id="coin-pop" class="coin-pop"></span></span>
            <button type="button" class="pill timer-pill" id="timer-pill" hidden></button>
            <span class="pill" id="clock">--:--</span>
          </div>

          <!-- 상점 -->
          <div id="shop" class="shop" hidden>
            <div class="shop-head">
              <div class="tabs">
                <button type="button" class="tab" data-cat="furniture">가구</button>
                <button type="button" class="tab" data-cat="prop">소품</button>
                <button type="button" class="tab" data-cat="wall">벽지</button>
                <button type="button" class="tab" data-cat="floor">바닥</button>
                <button type="button" class="tab" data-cat="room">방</button>
                <button type="button" class="tab" data-cat="look">캐릭터</button>
                <button type="button" class="tab" data-cat="pet">친구</button>
              </div>
              <button id="shop-close" type="button">닫기</button>
            </div>
            <div id="shop-list" class="shop-list"></div>
          </div>

          <!-- 집중 타이머 · 오늘 할 일 -->
          <div id="focus" class="panel" hidden>
            <div class="panel-head">
              <strong>집중</strong>
              <button id="focus-close" type="button">닫기</button>
            </div>
            <div class="panel-body">
              <section class="timer">
                <div id="timer-time" class="timer-time">25:00</div>
                <div class="chips">
                  <button type="button" data-min="15">15분</button>
                  <button type="button" data-min="25">25분</button>
                  <button type="button" data-min="50">50분</button>
                </div>
                <div class="timer-actions">
                  <button id="timer-start" type="button">시작</button>
                  <button id="timer-stop" type="button" hidden>그만두기</button>
                </div>
                <p id="timer-info" class="muted"></p>
              </section>
              <section class="todos">
                <h3>오늘 할 일</h3>
                <form id="todo-form" class="todo-form">
                  <input id="todo-input" type="text" maxlength="60" placeholder="할 일을 적어 보세요" autocomplete="off">
                  <button type="submit">추가</button>
                </form>
                <ul id="todo-list" class="todo-list"></ul>
                <div class="todo-foot">
                  <span id="todo-info" class="muted"></span>
                  <button id="todo-clear" type="button" hidden>끝낸 일 지우기</button>
                </div>
              </section>
            </div>
          </div>

          <!-- 아직 열지 않은 방 -->
          <div id="locked" class="locked" hidden>
            <div class="locked-box">
              <div id="lock-name" class="locked-name"></div>
              <div class="locked-price"><i class="coin"></i><span id="lock-price"></span></div>
              <button id="lock-buy" type="button">열기</button>
            </div>
          </div>

          <div id="toast" class="toast"></div>
        </div>

        <div class="toolbar">
          <div class="room-picker">
            <button id="room-prev" type="button" aria-label="이전 방">‹</button>
            <span id="room-name"></span>
            <button id="room-next" type="button" aria-label="다음 방">›</button>
          </div>
          <div class="actions">
            <button id="focus-btn" type="button">집중</button>
            <button id="shop-btn" type="button">상점</button>
            <button id="edit-btn" type="button">꾸미기</button>
            <button id="pip-btn" type="button">위에 띄우기</button>
          </div>
        </div>

        <!-- 꾸미기 중에만 보이는 보관함 -->
        <div id="edit-bar" class="edit-bar" hidden>
          <p class="edit-hint">보관함의 물건을 누르면 방에 놓여요. 방의 물건을 누르면 방향을 돌리거나 보관함에 넣을 수 있어요.</p>
          <div id="sel-bar" class="sel-bar" hidden>
            <span id="sel-name"></span>
            <button id="sel-rotate" type="button" title="R 키로도 돌릴 수 있어요">방향 돌리기</button>
            <button id="sel-store" type="button">보관함에 넣기</button>
            <button id="sel-cancel" type="button" aria-label="선택 해제">×</button>
          </div>
          <div id="inventory" class="inventory"></div>
        </div>
      </div>
      <p id="pip-placeholder" class="placeholder" hidden>방이 작은 창으로 나가 있어요. 작은 창을 닫으면 여기로 돌아옵니다.</p>
    </div>

    <p class="hint">켜두는 동안 1분에 2코인이 모여요. 꺼져 있을 때도 최대 3시간치까지 쌓여요.</p>
    <p id="pip-note" class="note"></p>
  </main>

  <!-- 순서 중요: 데이터 → 방 → 저장 → 게임 → 집중 → 로그인 -->
  <script src="data.js"></script>
  <script src="rooms.js"></script>
  <script src="save.js"></script>
  <script src="game.js"></script>
  <script src="focus.js"></script>
  <!-- 구글 로그인 (Supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="cloud.js"></script>
</body>
</html>
